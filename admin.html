<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบคลังสินค้า | HAIR CARE SHOP</title><link rel="stylesheet" href="styles.css"><style>.admin{padding:35px 6%;}.admin table{width:100%;border-collapse:collapse;background:white;font-size:14px}.admin th,.admin td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.admin th{background:#385b4b;color:white}.admin button{margin:3px;padding:7px 12px;border:0;background:#385b4b;color:white;cursor:pointer}.admin .danger{background:#a55}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}</style></head><body><header class="top"><a class="brand" href="index.html">HAIR<span>CARE</span></a><b>ระบบจัดการออเดอร์และคลังสินค้า</b><a href="index.html">กลับหน้าร้าน</a></header><main class="admin"><p class="eyebrow">WAREHOUSE MANAGEMENT</p><h1>รายการคำสั่งซื้อ</h1><p>ระบบตัวอย่างสำหรับตรวจสอบออเดอร์ หยิบสินค้า แพ็กสินค้า และพิมพ์ใบปะหน้าพัสดุ</p><div class="tools"><button onclick="exportCSV()">ดาวน์โหลดออเดอร์ CSV</button><button onclick="window.print()">พิมพ์หน้านี้</button><button class="danger" onclick="clearOrders()">ล้างข้อมูลตัวอย่าง</button></div><div id="orders"></div><h2>ข้อมูลสต็อกสินค้า</h2><div id="stocks"></div></main><script>
const products=[{sku:'HC-01',name:'Daily Cleanse Shampoo',stock:30},{sku:'HC-02',name:'Smooth & Shine Hair Serum',stock:25}];
let orders=JSON.parse(localStorage.getItem('hairOrders')||'[]');
function save(){localStorage.setItem('hairOrders',JSON.stringify(orders));render()}
function render(){document.querySelector('#orders').innerHTML=orders.length?`<table><tr><th>Order ID</th><th>ลูกค้า</th><th>สินค้า</th><th>จำนวน</th><th>ยอดรวม</th><th>สถานะ</th><th>ดำเนินการ</th></tr>${orders.map((o,i)=>`<tr><td>${o.orderId}</td><td>${o.customer}<br>${o.phone}</td><td>${o.sku} ${o.product}</td><td>${o.qty}</td><td>${o.total.toLocaleString()} บาท</td><td>${o.status}</td><td><button onclick="status(${i},'หยิบสินค้าแล้ว')">หยิบแล้ว</button><button onclick="status(${i},'แพ็กสินค้าแล้ว')">แพ็กแล้ว</button><button onclick="label(${i})">ใบปะหน้า</button></td></tr>`).join('')}</table>`:'<p>ยังไม่มีคำสั่งซื้อ — ทดลองสั่งซื้อจากหน้าร้านก่อน</p>';document.querySelector('#stocks').innerHTML=`<table><tr><th>SKU</th><th>สินค้า</th><th>สต็อกตั้งต้น</th><th>จำนวนที่สั่ง</th><th>คงเหลือโดยประมาณ</th></tr>${products.map(p=>{let sold=orders.filter(o=>o.sku===p.sku).reduce((s,o)=>s+o.qty,0);return `<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.stock}</td><td>${sold}</td><td>${p.stock-sold}</td></tr>`}).join('')}</table>`}
function status(i,s){orders[i].status=s;save()}
function label(i){let o=orders[i],w=window.open('','_blank');w.document.write(`<html><head><title>ใบปะหน้าพัสดุ ${o.orderId}</title><style>body{font-family:Arial,sans-serif;padding:24px}.label{border:2px solid #222;padding:24px;max-width:600px}h2{margin-top:0}.muted{color:#555}hr{border:1px dashed #777}</style></head><body><div class="label"><h2>ใบปะหน้าพัสดุ / SHIPPING LABEL</h2><p><b>เลขที่คำสั่งซื้อ:</b> ${o.orderId}</p><hr><h3>ผู้รับ / SHIP TO</h3><p><b>${o.customer}</b></p><p>${o.phone}</p><p>${o.address}</p><hr><p><b>รายการ:</b> ${o.product} (${o.sku}) × ${o.qty}</p><p><b>ยอดรวม:</b> ${o.total.toLocaleString()} บาท</p><p class="muted">HAIR CARE SHOP · กรุณาตรวจสอบข้อมูลก่อนจัดส่ง</p></div><script>window.print()<\/script></body></html>`);w.document.close()}
function exportCSV(){let rows=[['Order ID','Date','Customer','Phone','Address','SKU','Product','Qty','Unit Price','Total','Status'],...orders.map(o=>[o.orderId,o.date,o.customer,o.phone,o.address,o.sku,o.product,o.qty,o.unitPrice,o.total,o.status])];let csv='\\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='orders.csv';a.click()}
function clearOrders(){if(confirm('ยืนยันล้างคำสั่งซื้อในเบราว์เซอร์นี้?')){orders=[];save()}}render();
</script></body></html>
